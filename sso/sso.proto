syntax = "proto3";

package auth;

option go_package = "github.com/rwrrioe/sso/gen/go/sso/v1/sso.pb.go;ssov1";

service Auth {
    rpc Register (RegisterRequest) returns (RegisterReponse);
    rpc Login (LoginRequest) returns (LoginResponse);
}

// service Permissions {
//     GetUserPermissions (GetUserPermissionsRequest) returns UserPermissions
// }

message RegisterRequest{
    string email = 1;
    string password = 2;
}

message RegisterReponse {
    int64 user_id = 1;
}

message LoginRequest {
    string email = 1;
    string password = 2;
    int32 app_id = 3;
}

message LoginResponse {
    string token = 1;
}